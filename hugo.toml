baseURL = 'https://1himan.github.io/'
locale = 'en-us'
title = 'Himan'
theme = 'shibui'

[params]
  defaultHeroImage = 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2200&q=80'
  defaultHeroAlt = 'A wide, atmospheric landscape from Unsplash'
  showreadingtime = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true
    style = 'monokai'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[[menus.main]]
  name = 'Writing'
  pageRef = '/blog'
  weight = 10

[[menus.main]]
  name = 'Code'
  pageRef = '/articles'
  weight = 20

[[menus.main]]
  name = 'Home'
  pageRef = '/'
  weight = 30
